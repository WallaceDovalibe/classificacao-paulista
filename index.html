   Capturados ao vivo em 20/09/2026 de eventos.admfutsal.com.br,
   em cada evento da Campeonato Paulista Sub-07..Sub-10 (A3),
   aba "TORNEIO UNIÃO - GRUPO 1..6":
     Sub-07 -> /evento/918   Sub-08 -> /evento/919
     Sub-09 -> /evento/920   Sub-10 -> /evento/921
   Formato de cada linha: [nome, vitorias, empates, derrotas, golsPro, golsContra]
   (pontos, jogos e saldo são derivados: pontos=V*3+E, jogos=V+E+D, saldo=GP-GC)

   RE-VERIFICAÇÃO: uma captura anterior (mesma sessão, ~30min antes)
   tinha Sub-09/Sub-10 com bem menos jogos disputados. Refazendo a
   captura ao vivo, Sub-07 e Sub-08 vieram IDÊNTICOS (confirmado
   campo a campo), mas Sub-09 e Sub-10 tinham partidas novas
   registradas nesse intervalo — não era erro de mapeamento de
   categoria (conferido pelo próprio cabeçalho "Categoria Sub-X"
   de cada página), e sim o calendário do Torneio União dessas
   categorias avançando em tempo real. Os números abaixo são o
   snapshot mais recente, capturado direto do DOM (não do cache
   do fetch). Isso é também a prova viva de por que a Fase 2/3
   (sincronização automática) do roadmap importa: um snapshot
   manual desatualiza rápido numa competição em andamento.
   ============================================================ */

const CATEGORIAS = ["Sub-07", "Sub-08", "Sub-09", "Sub-10"];
const GRUPOS = ["Grupo 1", "Grupo 2", "Grupo 3", "Grupo 4", "Grupo 5", "Grupo 6"];

function textoUltimaAtualizacao() {
  const iso = typeof window !== "undefined" ? window.__dadosAtualizadoEm : null;
  if (!iso) return "dados ainda não carregados";
  const d = new Date(iso);
  const dataStr = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  const horaStr = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return `atualizado em ${dataStr} às ${horaStr}`;
}

let TORNEIO_UNIAO = {}; // populado em runtime a partir de dados.json (ver iniciarApp no fim do arquivo)

function linhaDe([nome, v, e, d, gp, gc], extra) {
  const j = v + e + d;
  const pontos = v * 3 + e;
  const sg = gp - gc;
  return { nome, clube: nome, j, v, e, d, gp, gc, pontos, sg, ...extra };
}
function ordenar(rows) {
  return [...rows].sort((a, b) => b.pontos - a.pontos || b.v - a.v || b.sg - a.sg || b.gp - a.gp);
}

// Aba 1: Grupo Torneio União -> os 6 grupos reais da categoria escolhida
function gruposDaCategoria(categoria) {
  return GRUPOS.map((grupo) => ({
    grupo,
    linhas: ordenar(TORNEIO_UNIAO[categoria][grupo].map((row) => linhaDe(row))),
  }));
}

// Aba 2: Geral Torneio União -> soma as 4 categorias por clube dentro do seu grupo,
// depois ranqueia todos os clube-no-grupo juntos, em blocos de 8 (Ouro/Prata/Bronze/Rubi...)
const SERIES_NAMES = ["Ouro", "Prata", "Bronze", "Rubi", "Topázio", "Esmeralda"];
function serieDaPosicao(pos) {
  const idx = Math.floor((pos - 1) / 8);
  return SERIES_NAMES[idx] || `Divisão ${idx + 1}`;
}

function classificacaoGeralTorneioUniao() {
  const acc = {};
  CATEGORIAS.forEach((categoria) => {
    GRUPOS.forEach((grupo) => {
      TORNEIO_UNIAO[categoria][grupo].forEach(([nome, v, e, d, gp, gc]) => {
        const chave = nome + "|" + grupo;
        if (!acc[chave]) acc[chave] = { nome, clube: nome, grupo, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 };
        acc[chave].j += v + e + d;
        acc[chave].v += v;
        acc[chave].e += e;
        acc[chave].d += d;
        acc[chave].gp += gp;
        acc[chave].gc += gc;
      });
    });
  });
  const rows = ordenar(
    Object.values(acc).map((r) => ({ ...r, pontos: r.v * 3 + r.e, sg: r.gp - r.gc }))
  );
  return rows.map((row, i) => ({ ...row, posicao: i + 1, serie: serieDaPosicao(i + 1) }));
}

function calcDerivados(v, e, d, gp, gc) {
  const j = v + e + d;
  const pontos = v * 3 + e;
  const sg = gp - gc;
  const avg = gc > 0 ? +(gp / gc).toFixed(2) : gp;
  const it = j > 0 ? Math.round((1000 * pontos) / j) : 0;
  return { j, pontos, sg, avg, it };
}

function classificacaoAcessoA2() {
  const rows = RANKING_A3.map(([nome, v, e, d, gp, gc, negativos]) => {
    const der = calcDerivados(v, e, d, gp, gc);
    const bonifi = 0;
    const total = der.it + bonifi + negativos;
    return { nome, clube: nome, v, e, d, gp, gc, negativos, bonifi, ...der, total };
  });
  const ordenado = [...rows].sort((a, b) => b.total - a.total);
  return ordenado.map((r, i) => ({ ...r, posicao: i + 1, zona: i < 3 ? "acesso" : "permanencia" }));
}

function corDoClube(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) hash = (hash * 31 + nome.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function nomeCurto(nome) {
  const partes = nome.split(/ - | \| /).map((p) => p.trim()).filter(Boolean);
  if (partes.length <= 1) return nome;
  const ultima = partes[partes.length - 1];
  // sufixos triviais tipo "B", "A", "2" (times B/reservas) nao sao um nome por si so:
  // junta com o pedaco anterior em vez de mostrar so a letra.
  if (/^[A-Za-zÀ-ÿ0-9]{1,3}$/.test(ultima) && partes.length >= 2) {
    return partes[partes.length - 2] + " - " + ultima;
  }
  return ultima;
}
function iniciaisDoClube(nomeExibido) {
  const partes = nomeExibido.replace(/^(AA|AD|EC|CA|CE|GD|SC|SE|A\.D\.|A\.E\.|E\.C\.|C\.C\.)\s*/i, "").split(/[\s./]+/).filter(Boolean);
  const letras = partes.slice(0, 2).map((p) => p[0]).join("");
  return (letras || nomeExibido.slice(0, 2)).toUpperCase();
}
// A FPFS usa grafias diferentes do mesmo clube em páginas diferentes do site
// (ex.: Acesso A2/RANKING_A3 grava "razão social - nome curto", às vezes com uma
// grafia só ligeiramente diferente do nome usado no Torneio União). Esses aliases
// cobrem os casos em que nem o nome completo nem o nomeCurto() batem direto com
// uma chave de ESCUDOS_REAIS.
const ALIASES_ESCUDO = {
  "ATIBAIA FUTSAL /LAFS": "LIGA ATIBAIAENSE DE FUITSAL - LAFS",
  "ESPORTES CLUBE HORTOLANDIA - E.C. HORTOLANDIA - B": "PROSPERE / HORTOLANDIA - B",
  "RSOCCER CFA ASSOCIAÇÃO ESPORTIVA E CULTURAL": "RSOCCER",
  "FORMAÇÃO FUTSAL CAMISA DEZ LTDA - CAMISA 10 F.C. - B": "CAMISA 10 F.C. B",  "GUARULHENSE/TBC TRANPORTES": "GUARULHENSE/TBC TRANSPORTES",  "GUARULHENSE/TBC TRANPORTES": "GUARULHENSE/TBC TRANSPORTES",  "GUARULHENSE/TBC TRANPORTES": "GUARULHENSE/TBC TRANSPORTES",
};
function chaveComparavel(s) { return s.replace(/ \| /g, " - ").trim().toUpperCase(); } const ESCUDOS_POR_CHAVE_NORMALIZADA = {}; const ESCUDOS_POR_CURTO_NORMALIZADO = {}; Object.keys(ESCUDOS_REAIS).forEach((chave) => { ESCUDOS_POR_CHAVE_NORMALIZADA[chaveComparavel(chave)] = ESCUDOS_REAIS[chave]; ESCUDOS_POR_CURTO_NORMALIZADO[chaveComparavel(nomeCurto(chave))] = ESCUDOS_REAIS[chave]; }); const ALIASES_POR_CHAVE_NORMALIZADA = {}; Object.keys(ALIASES_ESCUDO).forEach((chave) => { ALIASES_POR_CHAVE_NORMALIZADA[chaveComparavel(chave)] = ALIASES_ESCUDO[chave]; }); function buscarEscudoReal(nome) {
  if (ESCUDOS_REAIS[nome]) return ESCUDOS_REAIS[nome];
  const curto = nomeCurto(nome);
  if (ESCUDOS_REAIS[curto]) return ESCUDOS_REAIS[curto];
  const alias = ALIASES_ESCUDO[nome];
  if (alias && ESCUDOS_REAIS[alias]) return ESCUDOS_REAIS[alias]; const chaveNome = chaveComparavel(nome); const chaveCurto = chaveComparavel(curto); if (ESCUDOS_POR_CHAVE_NORMALIZADA[chaveNome]) return ESCUDOS_POR_CHAVE_NORMALIZADA[chaveNome]; if (ESCUDOS_POR_CURTO_NORMALIZADO[chaveCurto]) return ESCUDOS_POR_CURTO_NORMALIZADO[chaveCurto]; const aliasNormalizado = ALIASES_POR_CHAVE_NORMALIZADA[chaveNome] || ALIASES_POR_CHAVE_NORMALIZADA[chaveCurto]; if (aliasNormalizado && ESCUDOS_REAIS[aliasNormalizado]) return ESCUDOS_REAIS[aliasNormalizado];
  return null;
}
function Escudo({ nome, size = "w-7 h-7" }) {
  const curto = nomeCurto(nome);
  const imagemReal = buscarEscudoReal(nome);
  const [falhou, setFalhou] = useState(false);
  if (imagemReal && !falhou) {
    return (
      <img
        src={imagemReal}
        alt={nome}
        title={nome}
        onError={() => setFalhou(true)}
        className={`${size} rounded-full object-cover shrink-0 shadow-sm bg-white`}
      />
    );
  }
  return (
    <div title={nome} className={`${size} ${corDoClube(nome)} rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 shadow-sm`}>
      {iniciaisDoClube(curto)}
    </div>
  );
}

const SERIE_STYLE = {
  Ouro:    { bar: "bg-amber-400",  chip: "bg-amber-50 text-amber-700 border-amber-200" },
  Prata:   { bar: "bg-slate-400",  chip: "bg-slate-100 text-slate-600 border-slate-300" },
  Bronze:  { bar: "bg-orange-400", chip: "bg-orange-50 text-orange-700 border-orange-200" },
  Rubi:    { bar: "bg-red-500",    chip: "bg-red-50 text-red-700 border-red-200" },
  Topázio: { bar: "bg-cyan-400",   chip: "bg-cyan-50 text-cyan-700 border-cyan-200" },
};
function estiloSerie(serie) {
  return SERIE_STYLE[serie] || { bar: "bg-slate-300", chip: "bg-slate-50 text-slate-500 border-slate-200" };
}
const MEDALHA = { 1: "🥇", 2: "🥈", 3: "🥉" };
const PODIO_STYLE = {
  1: "bg-gradient-to-r from-amber-100 to-amber-50 border-l-4 border-amber-500",
  2: "bg-gradient-to-r from-slate-100 to-slate-50 border-l-4 border-slate-400",
  3: "bg-gradient-to-r from-orange-100 to-orange-50 border-l-4 border-orange-400",
};

function TabelaClassificacao({ rows, modoDestaque }) {
  // modoDestaque: "serie" (barra Ouro/Prata/Bronze) | "acesso" (pódio reforçado) | null
  return (
    <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
      <table className="min-w-full border-collapse text-sm">
        <thead>
          <tr className="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-wide">
            <th className="w-8 py-2 text-center font-semibold">#</th>
            <th className="py-2 pl-1 text-left font-semibold">Clube</th>
            <th className="w-9 py-2 text-center font-semibold">J</th>
            <th className="hidden sm:table-cell w-9 py-2 text-center font-semibold">V</th>
            <th className="hidden sm:table-cell w-9 py-2 text-center font-semibold">E</th>
            <th className="hidden sm:table-cell w-9 py-2 text-center font-semibold">D</th>
            <th className="hidden md:table-cell w-11 py-2 text-center font-semibold">GP</th>
            <th className="hidden md:table-cell w-11 py-2 text-center font-semibold">GC</th>
            <th className="w-10 py-2 text-center font-semibold">SG</th>
            <th className="w-12 py-2 pr-2 text-center font-semibold">{modoDestaque === "acesso" ? "TOTAL" : "Pts"}</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => {
            const posicao = row.posicao || i + 1;
            const nome = row.nome || row.clube;
            const acesso = modoDestaque === "acesso" && row.zona === "acesso";
            const s = modoDestaque === "serie" && row.serie ? estiloSerie(row.serie) : null;
            const valorPrincipal = modoDestaque === "acesso" ? row.total.toLocaleString("pt-BR") : row.pontos;
            const podio = acesso ? PODIO_STYLE[posicao] : "";
            return (
              <tr key={nome + i} className={`border-t border-slate-100 hover:bg-slate-50 relative ${podio}`}>
                <td className="text-center text-sm font-bold relative">
                  {!acesso && s && <span className={`absolute left-0 top-0 bottom-0 w-1 ${s.bar}`}></span>}
                  {acesso ? <span className="text-base">{MEDALHA[posicao]}</span> : <span className="text-slate-400 text-xs">{posicao}</span>}
                </td>
                <td className="py-1.5 pl-1">
                  <div className="flex items-center gap-2">
                    <Escudo nome={nome} />
                    <span className={`font-medium text-xs sm:text-sm truncate max-w-[110px] sm:max-w-[240px] ${acesso ? "text-slate-900 font-bold" : "text-slate-800"}`} title={nome}>
                      {nomeCurto(nome)}
                    </span>
                    {acesso && <span className="hidden sm:inline-block text-[9px] font-bold text-emerald-700 bg-emerald-100 border border-emerald-300 px-1.5 py-0.5 rounded-full">SOBE</span>}
                  </div>
                </td>
                <td className="text-center text-xs text-slate-500">{row.j}</td>
                <td className="hidden sm:table-cell text-center text-xs text-slate-500">{row.v}</td>
                <td className="hidden sm:table-cell text-center text-xs text-slate-500">{row.e}</td>
                <td className="hidden sm:table-cell text-center text-xs text-slate-500">{row.d}</td>
                <td className="hidden md:table-cell text-center text-xs text-slate-500">{row.gp}</td>
                <td className="hidden md:table-cell text-center text-xs text-slate-500">{row.gc}</td>
                <td className={`text-center text-xs font-medium ${row.sg > 0 ? "text-emerald-600" : row.sg < 0 ? "text-rose-600" : "text-slate-500"}`}>
                  {row.sg > 0 ? "+" + row.sg : row.sg}
                </td>
                <td className={`text-center pr-2 ${acesso ? "font-extrabold text-base text-slate-900" : "font-bold text-slate-900"}`}>{valorPrincipal}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function CardGrupo({ grupo, linhas }) {
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between px-1 mb-1.5">
        <h3 className="text-sm font-bold text-slate-200">{grupo}</h3>
        <span className="text-[10px] text-slate-400">{linhas.length} clubes</span>
      </div>
      <TabelaClassificacao rows={linhas} modoDestaque={null} />

  );
}

function LinhaDetalheCategoria({ categoria, dados }) {
  if (!dados) return null;
  const [v, e, d, gp, gc] = dados;
  const der = calcDerivados(v, e, d, gp, gc);
  return (
    <div className="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-2 text-center min-w-[92px]">
      <div className="text-[10px] font-bold text-slate-500 mb-1">{categoria}</div>
      <div className="text-sm font-extrabold text-slate-900">{der.pontos} <span className="text-[9px] font-normal text-slate-400">pts</span></div>
      <div className="text-[10px] text-slate-500">{der.j}J · {v}V {e}E {d}D</div>
      <div className="text-[10px] text-slate-500">{gp}:{gc} <span className={der.sg >= 0 ? "text-emerald-600" : "text-rose-600"}>({der.sg > 0 ? "+" + der.sg : der.sg})</span></div>
      <div className="text-[9px] text-slate-400 mt-0.5">Avg {der.avg} · IT {der.it}</div>
    </div>
  );

const SOBRENOMES_MOCK = ["Silva","Souza","Oliveira","Santos","Pereira","Costa","Ferreira","Rodrigues","Almeida","Nascimento","Lima","Araújo","Fernandes","Carvalho","Gomes","Martins","Rocha","Ribeiro","Alves","Monteiro","Barbosa","Cardoso","Correia","Teixeira","Moreira","Cavalcanti","Dias","Castro","Campos","Pinto"];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function embaralhar(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function isoDoDia(diasDesdeEpoca) {
  const d = new Date(diasDesdeEpoca * 86400000);
  const ano = d.getUTCFullYear();
  const mes = String(d.getUTCMonth() + 1).padStart(2, "0");
  const dia = String(d.getUTCDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}
const HOJE_EPOCH_DIAS = Math.floor(Date.UTC(2026, 8, 20) / 86400000); // 20/09/2026
function somarDias(delta) { return isoDoDia(HOJE_EPOCH_DIAS + delta); }
function formatarDataCurta(iso) {
  const [, mes, dia] = iso.split("-");
  return `${dia}/${mes}`;
}
function formatarDataCompleta(iso) {
  const [ano, mes, dia] = iso.split("-");
  return `${dia}/${mes}/${ano}`;
}
function nomeAleatorio(rng) {
  const n = NOMES_MOCK[Math.floor(rng() * NOMES_MOCK.length)];
  const s1 = SOBRENOMES_MOCK[Math.floor(rng() * SOBRENOMES_MOCK.length)];
  const s2 = SOBRENOMES_MOCK[Math.floor(rng() * SOBRENOMES_MOCK.length)];
  return `${n} ${s1} ${s2}`;
}
function clubesPaulista() {

}

  GRUPOS.forEach((g) => TORNEIO_UNIAO[categoria][g].forEach((r) => set.add(r[0])));

function FiltroCategoria({ valor, aoMudar }) {

function FiltroGrupos({ selecionados, aoAlternar, aoSelecionarTodos }) {
  const todosSelecionados = selecionados.size === GRUPOS.length;
  return (
    <div className="flex gap-1.5 overflow-x-auto pb-1">
      <button
        onClick={aoSelecionarTodos}
        className={`shrink-0 text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${
          todosSelecionados ? "bg-violet-500 text-white border-violet-500" : "bg-transparent text-slate-300 border-slate-600"
        }`}

        Todos os Grupos
      </button>
      {GRUPOS.map((g) => (
        <button
          key={g}
          onClick={() => aoAlternar(g)}

            selecionados.has(g) ? "bg-violet-500 text-white border-violet-500" : "bg-transparent text-slate-300 border-slate-600"
          }`}
        >

function AbaJogos() {
  // Foco único: Torneio União de Clubes (sem seletor de campeonato — o
  // Paulista já encerrou a temporada). categoria=null significa "Todas".
  const [categoria, setCategoria] = useState(null);
  const [status, setStatus] = useState("finalizado");
  const [gruposSelecionados, setGruposSelecionados] = useState(() => new Set(GRUPOS));
  const [gruposFechados, setGruposFechados] = useState({});

  function alternarGrupoFiltro(g) {
    setGruposSelecionados((prev) => {
      // Partindo de "todos selecionados", 1 clique isola so o grupo escolhido
      // (evita ter que desmarcar os outros 5 manualmente). A partir de um
      // estado ja filtrado, cliques seguintes alternam individualmente, e
      // esvaziar tudo volta para "todos".
      if (prev.size === GRUPOS.length) {
        return new Set([g]);
      }
      const next = new Set(prev);
      if (next.has(g)) next.delete(g); else next.add(g);
      return next.size === 0 ? new Set(GRUPOS) : next;
    });
  }
  function selecionarTodosGrupos() {
    setGruposSelecionados(new Set(GRUPOS));
  }

  const porGrupo = useMemo(() => {
    return GRUPOS.filter((g) => gruposSelecionados.has(g)).map((grupo) => {
      const jogosDoGrupo = JOGOS_UNIAO.filter(
        (j) => j.grupo === grupo && j.status === status && (categoria === null || j.categoria === categoria)
      );
      const ordenados = [...jogosDoGrupo].sort((a, b) => {
        const porData = status === "finalizado" ? b.data.localeCompare(a.data) : a.data.localeCompare(b.data);
        return porData || a.categoria.localeCompare(b.categoria);
      });
      return { grupo, jogos: ordenados };
    }).filter((g) => g.jogos.length > 0);
  }, [categoria, status, gruposSelecionados]);

  function alternarGrupo(grupo) {
    setGruposFechados((prev) => ({ ...prev, [grupo]: !prev[grupo] }));
  }

  return (
    <div>
      <div className="px-3 pt-3 pb-2 sticky top-[52px] z-10 bg-slate-900/95 backdrop-blur space-y-2">
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button
            onClick={() => setCategoria(null)}
            className={`shrink-0 text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${
              categoria === null ? "bg-sky-500 text-white border-sky-500" : "bg-transparent text-slate-300 border-slate-600"
            }`}
          >
            Todas
          </button>
          {CATEGORIAS.map((c) => (
            <button
              key={c}
              onClick={() => setCategoria(c)}
              className={`shrink-0 text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${
                categoria === c ? "bg-sky-500 text-white border-sky-500" : "bg-transparent text-slate-300 border-slate-600"
              }`}
            >
              {c}
            </button>
          ))}
        </div>
        <FiltroGrupos selecionados={gruposSelecionados} aoAlternar={alternarGrupoFiltro} aoSelecionarTodos={selecionarTodosGrupos} />
        <div className="flex rounded-lg border border-slate-700 overflow-hidden">
          <button
            onClick={() => setStatus("finalizado")}
            className={`flex-1 text-xs font-semibold py-1.5 transition ${status === "finalizado" ? "bg-slate-700 text-white" : "text-slate-400"}`}
          >
            Últimos Resultados
          </button>
          <button
            onClick={() => setStatus("agendado")}
            className={`flex-1 text-xs font-semibold py-1.5 transition ${status === "agendado" ? "bg-slate-700 text-white" : "text-slate-400"}`}
          >
            Próximos Jogos
          </button>
        </div>
      </div>

      <div className="px-3 pt-1">
        <p className="text-[11px] text-slate-400 mb-2">
          Foco no <strong className="text-slate-200">Torneio União de Clubes</strong> — o Campeonato Paulista já encerrou a temporada. Use o filtro de grupos para escolher quais ver; toque no cabeçalho de um grupo para recolher.
        </p>
        <div className="flex items-center gap-1.5 text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-md px-2 py-1 mb-3">
          <span>✅</span><span>Dados reais — eventos.admfutsal.com.br, {textoUltimaAtualizacao()} (grade oficial "TORNEIO UNIÃO" de cada categoria: {JOGOS_UNIAO.length} jogos, resultados e agenda).</span>
        </div>
        {porGrupo.length === 0 ? (
          <p className="text-center text-xs text-slate-500 py-8">Nenhum jogo encontrado para esse filtro.</p>
        ) : (
          porGrupo.map(({ grupo, jogos }) => {
            const fechado = !!gruposFechados[grupo];
            return (
              <div key={grupo} className="mb-4">
                <button onClick={() => alternarGrupo(grupo)} className="w-full flex items-center justify-between px-1 mb-1.5">
                  <h3 className="text-sm font-bold text-slate-200">{grupo}</h3>
                  <span className="flex items-center gap-1.5 text-[10px] text-slate-400">
                    {jogos.length} jogo{jogos.length !== 1 ? "s" : ""}
                    <span className={`inline-block transition-transform ${fechado ? "" : "rotate-90"}`}>▶</span>
                  </span>
                </button>
                {!fechado && jogos.map((j) => (status === "finalizado" ? <CardResultado key={j.id} jogo={j} /> : <CardProximo key={j.id} jogo={j} />))}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function AbaArtilharia() {
  const [campeonato, setCampeonato] = useState("paulista");
  const [categoria, setCategoria] = useState(CATEGORIAS[0]);

  const ranking = useMemo(() => {
    return ARTILHEIROS
      .filter((j) => j.campeonato === campeonato && j.categoria === categoria)
      .sort((a, b) => b.gols - a.gols)
      .slice(0, 20);
  }, [campeonato, categoria]);

  return (
    <div>
      <div className="px-3 pt-3 pb-2 sticky top-[52px] z-10 bg-slate-900/95 backdrop-blur space-y-2">
        <FiltroCampeonato valor={campeonato} aoMudar={setCampeonato} />
        <FiltroCategoria valor={categoria} aoMudar={setCategoria} />
      </div>
      <div className="px-3 pt-1">
        <div className="flex items-center gap-1.5 text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-md px-2 py-1 mb-3">
          <span>✅</span><span>Dados reais — eventos.admfutsal.com.br/evento/&#123;id&#125;/artilharia, {textoUltimaAtualizacao()} (top 15 por categoria).</span>
        </div>
        <p className="text-[10px] text-slate-500 mb-3 leading-snug">
          <strong className="text-slate-400">Torneio União</strong>: soma direta dos gols de cada jogador nas abas oficiais "TORNEIO UNIÃO – GRUPO 1 a 6".{" "}
          <strong className="text-slate-400">Campeonato Paulista</strong>: a FPFS não publica uma aba só do Paulista — cada jogador tem 1 total "Geral" (evento inteiro, somando 1ª fase + mata-mata + Torneio União). Por isso o valor do Paulista aqui é <em>calculado</em> como Geral − gols no Torneio União.{" "}
          <strong className="text-slate-400">Total</strong>: o número "Geral" da FPFS direto da fonte, sem nenhum cálculo — Campeonato Paulista + Torneio União somados.
        </p>
        <ListaArtilheiros jogadores={ranking} />
      </div>
    </div>
  );
}

async function iniciarApp() {
  try {
    const resp = await fetch("dados.json?" + Date.now());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const dados = await resp.json();
    RANKING_A3 = dados.rankingGeral || [];
    TORNEIO_UNIAO = dados.torneioUniao || {};
    CATEGORIAS.forEach((cat) => {
      if (!TORNEIO_UNIAO[cat]) TORNEIO_UNIAO[cat] = {};
      GRUPOS.forEach((g) => { if (!TORNEIO_UNIAO[cat][g]) TORNEIO_UNIAO[cat][g] = []; });
    });
    JOGOS_UNIAO_TUPLAS = dados.jogosUniao || [];
    ARTILHEIROS_TUPLAS = dados.artilheiros || [];
    JOGOS_UNIAO = construirJogosUniao();
    ARTILHEIROS = construirArtilharia();
    window.__dadosAtualizadoEm = dados.atualizadoEm || null;
  } catch (e) {
    console.error("Não consegui carregar dados.json — o app vai abrir sem dados. Detalhe:", e);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
iniciarApp();
</script>
